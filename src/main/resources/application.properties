server.port=8080
spring.application.name=nutriwarrior

spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.profiles.default=dev
app.jwt.secret=${JWT_SECRET:dev-only-secret-for-tests-please-change-1234567890}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Ollama / NutriWarrior Assistant
app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b}
app.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:60}
app.ollama.keep-alive=${OLLAMA_KEEP_ALIVE:10m}
